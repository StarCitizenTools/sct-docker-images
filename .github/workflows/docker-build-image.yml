name: 🐳 Build & Push Images to GHCR

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      update_composer_dependencies:
        description: 'Force a full refresh of Composer dependencies'
        required: true
        type: boolean
        default: false
      update_system_dependencies:
        description: 'Force a refresh of apt system packages'
        required: true
        type: boolean
        default: false
      update_php_extensions:
        description: 'Force a refresh of PHP extensions'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      -
        name: 🔒 Set Calver Version
        uses: Nelyx/action-calver@v1.1.0
        id: setcalver
        with:
          default_branch: 'refs/heads/main'
          format: 'YY.MM.DD'
      -
        name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # Images are published to GHCR, but the Dockerfiles still pull their
        # base images (nginx, php, composer, php-extension-installer) from
        # Docker Hub. Authenticating here lifts those base-image pulls above
        # Docker Hub's anonymous per-IP rate limit. Do not remove.
        name: 🔑 Login to Docker Hub (base image pulls)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: 🔑 Login to GHCR (push registry)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: 🏗️ Build and push all images to GHCR
        uses: docker/bake-action@v7
        with:
          push: true
          files: docker-bake.hcl
        env:
          TAG: ${{ steps.setcalver.outputs.package_version }}
          UPDATE_COMPOSER_DEPENDENCIES: ${{ github.event.inputs.update_composer_dependencies == 'true' && github.run_id || 'false' }}
          UPDATE_SYSTEM_DEPENDENCIES: ${{ github.event.inputs.update_system_dependencies == 'true' && github.run_id || 'false' }}
          UPDATE_PHP_EXTENSIONS: ${{ github.event.inputs.update_php_extensions == 'true' && github.run_id || 'false' }}
      -
        # Ask sct-k8-config to open its "Bump Docker images" PR for this stamp.
        # Needs a fine-grained PAT with Contents: read/write on sct-k8-config
        # (repository_dispatch requires it) stored as K8_CONFIG_DISPATCH_TOKEN.
        # Without the secret the build still succeeds; bump by hand instead.
        name: 🚀 Notify sct-k8-config
        env:
          GH_TOKEN: ${{ secrets.K8_CONFIG_DISPATCH_TOKEN }}
          STAMP: ${{ steps.setcalver.outputs.package_version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::K8_CONFIG_DISPATCH_TOKEN not set; not opening a bump PR in sct-k8-config."
            exit 0
          fi
          gh api "repos/${{ github.repository_owner }}/sct-k8-config/dispatches" \
            -f event_type=app-images-built \
            -f "client_payload[stamp]=${STAMP}"
          echo "Dispatched app-images-built for ${STAMP}."
