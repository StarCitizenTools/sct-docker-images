version: 2

# Dependabot alerts do not cover Docker base images, so the scheduled docker
# bumps below are the only path for patches in the php/nginx bases. The
# cooldown, not the check frequency, is what delays a release; see the docker
# entry for why php skips it.

updates:
  # ---------------------------------------------------------------- actions --
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # ----------------------------------------------------------------- images --
  # Dependabot only parses FROM lines, which is why the Dockerfiles declare
  # COPY --from sources as named stages.
  - package-ecosystem: docker
    directories:
      - "/mediawiki"
      - "/jobrunner"
      - "/nginx"
    # Daily so php's cooldown exemption below isn't spent waiting for the next
    # weekly run.
    schedule:
      interval: daily
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      # Only php patch releases reach this entry (see ignore), and those are
      # where PHP security fixes ship, so take them as soon as Docker Hub has
      # them. Merging here only builds images; nothing reaches production
      # until the sct-k8-config bump PR is merged.
      exclude:
        - "php"
    ignore:
      # PHP minor/major bumps are done by hand; only patch releases flow through here.
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns:
          - "*"

  # -------------------------------------------------------------- jobrunner --
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # `cooldown` is unsupported for gitsubmodule.
    open-pull-requests-limit: 1
