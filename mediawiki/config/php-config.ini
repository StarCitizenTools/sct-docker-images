# Error Logging
error_reporting = E_ALL
log_errors = On
# Not stdout: runJobs.php writes its --result=json payload there, and the
# jobrunner logs severity=ERROR when it cannot parse it.
error_log = /dev/stderr
display_errors = Off

# Upload Config
upload_max_filesize = 64M
post_max_size = 64M
# Nothing in MediaWiki reads PHP's upload progress, and it is extra
# request-time state built from attacker-controlled multipart bodies.
session.upload_progress.enabled = Off

# No X-Powered-By header. MediaWiki still shows the PHP version on
# Special:Version and in the siteinfo API; this only keeps it out of every
# response.
expose_php = Off