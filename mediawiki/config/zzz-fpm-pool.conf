; Loaded last (php-fpm.d/*.conf globs in lexical order), so this wins over
; www.conf, docker.conf and zz-docker.conf.
;
; pm.* lives here rather than appended to zz-docker.conf because the base image
; marks that file's [www] header for removal in PHP 8.6+, after which appended
; directives land outside any pool and php-fpm refuses to start.
[www]
; Duplicates nginx's log with less detail; ~97% of this container's log lines.
; Must be /dev/null -- php-fpm has no unset, and an empty value fails startup.
access.log = /dev/null

pm.max_children = 30
pm.max_requests = 200
pm.start_servers = 10
pm.min_spare_servers = 10
pm.max_spare_servers = 30
