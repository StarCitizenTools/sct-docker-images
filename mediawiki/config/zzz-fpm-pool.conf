; Loaded last (php-fpm.d/*.conf globs in lexical order), so this wins over
; www.conf, docker.conf and zz-docker.conf.
;
; pm.* lives here rather than appended to zz-docker.conf because the base image
; marks that file's [www] header for removal in PHP 8.6+, after which appended
; directives land outside any pool and php-fpm refuses to start.
[www]
; Duplicates nginx's log with less detail; ~97% of this container's log lines.
; Must be /dev/null -- php-fpm has no unset, and an empty value fails startup.
access.log = /dev/null

pm.max_children = 30
pm.max_requests = 200
pm.start_servers = 10
pm.min_spare_servers = 10
pm.max_spare_servers = 30

; Backstop for workers max_execution_time cannot reclaim: this build has Zend Max
; Execution Timers disabled, so that limit is ITIMER_PROF (CPU only) and a request
; blocked on an unreachable MariaDB never trips it (2026-06-19).
;
; Wall clock here against CPU/shell time there, so it has to stay outside
; MediaWiki's own ceilings or it silently overrides them: $wgTransactionalTimeLimit
; 120, $wgMaxShellTime and $wgMaxShellWallClockTime 180, none overridden in config/.
request_terminate_timeout = 300s

; MediaWiki flushes the response via fastcgi_finish_request(), then runs its
; DB-heavy deferred updates (LinksUpdate, SMW, purges). The default `no` stops the
; timer at that flush, leaving exactly the hang above untracked. Shares the budget
; above rather than getting its own.
request_terminate_timeout_track_finished = yes
