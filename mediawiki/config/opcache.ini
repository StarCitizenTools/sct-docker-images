[opcache]
 
opcache.enable=1;
opcache.memory_consumption=128;
opcache.interned_strings_buffer=8;
opcache.max_accelerated_files=4000;
; Never recheck scripts on disk once cached. Code only changes by shipping a
; new image, which starts new php-fpm processes with an empty cache, so
; rechecking only costs stat() calls and would let a file modified inside a
; running pod take effect.
opcache.validate_timestamps=0;